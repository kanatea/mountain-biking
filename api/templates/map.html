<!DOCTYPE html>
<html lang="en">
    <head>
        <title>MtB Madeira</title>

        <!-- leaflet css map stuff-->
        <link type="text/css" rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
        
    <style>

        /* Map from OSM */
        /* Map from OSM */
        #map { 
        height: calc(100vh - 59px);
        width: 100%;
        display: block;
        z-index: 0;
        }

        :root {
            --moss:    #3a5c2e;
            --lime:    #a8c840;
            --white:   #f4f0e8;
            --muted:   #8a9e78;
            --bark:    #2c1f0e;
            }

        body {
            font-family: verdana, serif;
            color: var(--muted)
            /*text-align: center*/
        } 

        /* navigation */
        nav {
            background: var(--muted);
            border-bottom: 3px solid var(--lime);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 24px rgba(0,0,0,0.6);
        }

        .nav-inner {
            display: flex;
            align-items: stretch;
            max-width: 1400px;
            margin: 0 auto;
            height: 56px;
        }

        /* title */
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 24px;
            text-decoration: none;
            border-right: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }

        .nav-brand .icon {
            font-size: 22px;
            line-height: 1;
        }

        .nav-brand .wordmark {
            font-family: verdana, sans-serif;
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--moss);
        }

        /* Nav items */
        .nav-items {
            display: flex;
            align-items: stretch;
            list-style: none;
            flex: 1;
        }

        .nav-item {
            position: relative;
        }

        .nav-item > a,
        .nav-item > button {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 100%;
            padding: 0 20px;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--moss);
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }

        .nav-item > a:hover,
        .nav-item > button:hover,
        .nav-item.open > button {
            background: rgba(168,200,64,0.12);
            color: var(--lime);
        }

        .nav-item > button .chevron {
            font-size: 10px;
            transition: transform 0.2s;
        }
        .nav-item.open > button .chevron {
            transform: rotate(180deg);
        }

        /* Dropdown panels */
        .dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 3px);
            left: 0;
            background: var(--muted);
            border: 1px solid rgba(168,200,64,0.25);
            border-top: 3px solid var(--lime);
            min-width: 220px;
            max-width: 320px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            animation: dropIn 0.18s ease;
            z-index: 1001;
        }
        .nav-item.open .dropdown { display: block; }

        @keyframes dropIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .dropdown-section {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }
        .dropdown-section:last-child { border-bottom: none; }

        .dropdown-label {
            font-family: verdana, sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--moss);
            padding: 6px 18px 4px;
        }

         .dropdown a, .dropdown button.filter-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 9px 18px;
            font-family: 'Barlow', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--moss);
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            text-align: left;
            transition: background 0.12s, color 0.12s;
        }
    
        .dropdown a:hover, .dropdown button.filter-btn:hover {
            background: rgba(168,200,64,0.1);
            color: var(--lime);
        }

        /* Pill filters (for filter dropdown) */
        .filter-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 10px 18px;
        }
        .pill {
            font-family: verdana, sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1.5px solid rgba(168,200,64,0.35);
            background: transparent; 
            color: var(--moss);
            cursor: pointer;
            transition: all 0.15s;
        }

        .pill:hover, .pill.active {
            border-color: var(--lime);
            color: var(--lime);
            background: rgba(168,200,64,0.1);
        }

         /* Search bar*/
        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            margin-left: auto;
        }

        .nav-search {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            padding: 0 12px;
            gap: 8px;
            height: 34px;
        }
    
        .nav-search input {
            background: none;
            border: none;
            outline: none;
            color: var(--moss);
            font-family: verdana, sans-serif;
            font-size: 13px;
            width: 160px;
        }
    
        .nav-search input::placeholder { color: var(--moss); }
        .nav-search .search-icon { color: var(--moss); font-size: 13px; }

        .btn-cta {
            font-family: verdana, sans-serif;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            background: var(--lime);
            color: var(--bark);
            border: none;
            border-radius: 6px;
            padding: 0 16px;
            height: 34px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-cta:hover { background: #c0e04a; }

        /* Review form */
        .review-form {
            padding: 4px 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .review-trail-label {
            font-family: verdana, sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--moss);
            margin-top: 4px;
            display: block;       
            width: 100%;           
            box-sizing: border-box;
            padding: 6px 0 4px;
        }

        .review-trail-input {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--moss);
            font-family: verdana, sans-serif;
            font-size: 13px;
            outline: none;
            display: block;       
            width: 100%;           
            box-sizing: border-box;
            transition: border-color 0.15s;
        }
        .review-trail-input:focus {
            border-color: var(--lime);
        }
        .review-trail-input::placeholder { color: var(--moss); }

         .star-rating {
            display: flex;
            gap: 4px;
         }
        .star {
            font-size: 26px;
            color: rgba(255,255,255,0.15);
            cursor: pointer;
            transition: color 0.1s, transform 0.1s;
            line-height: 1;
        }
        .star:hover, .star.selected {
            color: var(--lime);
        }
        .star:hover {
            transform: scale(1.2);
        }

        .review-textarea {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            padding: 10px 12px;
            color: var(--moss);
            font-family: verdana, sans-serif;
            font-size: 13px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            resize: vertical;
            min-height: 90px;
            transition: border-color 0.15s;
        }
        .review-textarea:focus {
            border-color: var(--lime);
        }
        .review-textarea::placeholder { color: var(--moss); }

        .review-submit {
            font-family: verdana, sans-serif;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            background: var(--lime);
            color: var(--bark);
            border: none;
            border-radius: 6px;
            padding: 9px 0;
            cursor: pointer;
            width: 100%;
            transition: background 0.15s;
            margin-top: 4px;
        }
        .review-submit:hover { background: #c0e04a; }

        .review-thanks {
            text-align: center;
            padding: 16px 18px;
            font-family: verdana, sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--lime);
            letter-spacing: 0.05em;
            display: none;
        }
    
    </style>
    </head>



    <body>
        <!-- wtf-->
         <nav>
        <div class="nav-inner">

            <!-- Title -->
            <a href="#" class="nav-brand">
                <!-- <h1><img src="MTB_Madeira.png" alt="logo" class="logo"></h1> -->
                <span class="wordmark">MtB Madeira</span>
            </a>

            <!-- Nav items -->
            <ul class="nav-items">

            <!-- Filter By -->
            <li class="nav-item" id="item-filter">
                <button onclick="toggleDropdown('item-filter')">
                    Filter By <span class="chevron">▼</span>
                </button>
                <div class="dropdown" style="min-width:280px">

                            <button class="pill">🔴 Category 2</button>
                            <button class="pill">⚫ Category 1</button>
                            <button class="pill">🟠 Hors Catégorie</button>

                    </div>
                    <div class="dropdown-section">

                            <button class="pill">< 5 km</button>
                            <button class="pill">5–10 km</button>
                            <button class="pill">10+ km</button>
                        </div>
                    </div>
                    <div class="dropdown-section">
                        <div class="dropdown-label">Elevation Gain</div>

                            <button class="pill active">All</button>

            <!-- Trail Reviews -->
            <li class="nav-item" id="item-reviews">
                <button onclick="toggleDropdown('item-reviews')">
                    Trail Reviews <span class="chevron">▼</span>

                <div class="dropdown" style="min-width:300px">
                    <div class="dropdown-section">

                        <div class="review-trail-label">Trail name</div>
                        <input type="text" class="review-trail-input" 
                            id="review-trail-input"

                            placeholder="Search for a trail…" 
                            autocomplete="off" />
                        <div class="review-trail-label">Your Rating</div>

                    <div class="review-trail-label">Your Comment</div>

                <div class="dropdown">
                <div class="dropdown-section">

                    <div class="review-form" style="padding: 4px 18px 12px; gap: 8px;">
                <input type="text" class="review-trail-input" id="nearme-location" placeholder="Enter region" />

                <select class="review-trail-input" id="nearme-radius">

                    <option value="10">Within 10 km</option>
                    <option value="20">Within 20 km</option>
                </select>

                <button class="review-submit" id="nearme-submit">📍 Use My Location</button>
                <button class="review-submit" id="nearme-clear" style="background:#ccc;color:#2c1f0e;">Clear Near Me</button>

            <!-- Report a Problem -->
            <li class="nav-item" id="item-report">

                        <input type="text" class="review-trail-input"

                        autocomplete="off"
                    />
                      <button

    <!-- for autopopulating trail name search bar -->
        <datalist id="trail-names-list">

    <!-- BEGIN NAV/UI SCRIPT -->
        <script>
            function toggleDropdown(id) {
                const item = document.getElementById(id);
                const isOpen = item.classList.contains('open');
                document.querySelectorAll('.nav-item.open').forEach(el => el.classList.remove('open'));

                if (!isOpen) {
                    item.classList.add('open');

                    // If opening the Review dropdown, reset it
                    if (id === 'item-reviews') {
                    resetReviewForm();
                    }

                    // If opening the Report dropdown, we’ll also reset it (next section)
                    if (id === 'item-report') {
                    resetReportForm();
                    }
                }
                }

            // Close on outside click
            document.addEventListener('click', e => {
                if (!e.target.closest('.nav-item')) {
                    document.querySelectorAll('.nav-item.open').forEach(el => el.classList.remove('open'));
                }
            });

            // Star rating
            const stars = document.querySelectorAll('.star');
            let selectedRating = 0;

            stars.forEach(star => {
                star.addEventListener('mouseover', () => {
                    const val = parseInt(star.dataset.val);
                    stars.forEach(s => s.classList.toggle('selected', parseInt(s.dataset.val) <= val));
                });
            star.addEventListener('mouseout', () => {
                stars.forEach(s => s.classList.toggle('selected', parseInt(s.dataset.val) <= selectedRating));
            });
            star.addEventListener('click', () => {
                selectedRating = parseInt(star.dataset.val);
                stars.forEach(s => s.classList.toggle('selected', parseInt(s.dataset.val) <= selectedRating));
            });
            });

        // Reset review form
        function resetReviewForm() {
        const form = document.querySelector('#item-reviews .review-form');
        if (!form) return;

        // Clear inputs
        const usernameInput = document.querySelector('#review-username');
        const trailInput    = document.querySelector('#review-trail-input');
        const commentArea   = document.querySelector('#item-reviews .review-textarea');

        if (usernameInput) usernameInput.value = '';
        if (trailInput)    trailInput.value    = '';
        if (commentArea)   commentArea.value   = '';

        // Reset stars
        const stars = document.querySelectorAll('#item-reviews .star');
        stars.forEach(s => s.classList.remove('selected'));
        selectedRating = 0;

        // Show form again, hide any thank‑you message
        form.style.display = 'flex';
        const thanks = document.querySelector('#item-reviews .review-thanks');
        if (thanks) {
            thanks.style.display = 'none';
            thanks.innerHTML = '';
        }
        }

            // Review submit
            document.querySelector('#review-submit').addEventListener('click', () => {
                const trail_name = document.querySelector('#review-trail-input').value.trim();
                const username   = document.querySelector('#review-username').value.trim();
                const comment    = document.querySelector('.review-textarea').value.trim();
                if (!username)       { alert('Please enter a username!'); return; }
                if (!trail_name)     { alert('Please enter a trail name!'); return; }
                if (!isValidTrail(trail_name)) { alert('Please select a valid trail from the list.'); return; }
                if (!selectedRating) { alert('Please select a star rating!'); return; }

                fetch('/api/reviews', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, trail_name, rating: selectedRating, comment })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.querySelector('.review-form').style.display = 'none';
                        const thanks = document.createElement('div');
                        thanks.className = 'review-thanks';
                        thanks.innerHTML = `Thank you, ${username}! :-)`;
                        thanks.style.display = 'block';
                        document.querySelector('#item-reviews .dropdown-section').appendChild(thanks);
                    }
                })
                .catch(err => {
                    console.error('Error submitting review:', err);
                    alert('Something went wrong. Please try again :-( ');
                });
            });
            
            // Near Me geolocation 
            async function geocodeAddress(query) {
            const params = new URLSearchParams({
                format: 'json',
                q: query,
                limit: '1',
                viewbox: '-17.30,32.60,-16.70,32.86',
                bounded: '1',
                countrycodes: 'pt'
            });

            const url = `https://nominatim.openstreetmap.org/search?${params.toString()}`;

            const res = await fetch(url, {
                headers: {
                'Accept': 'application/json'
                // In production, set a proper User-Agent/Referer per Nominatim policy.
                }
            });
            const data = await res.json();
            if (!data || !data.length) {
                return null;
            }
            return {
                lat: parseFloat(data[0].lat),
                lon: parseFloat(data[0].lon),
                displayName: data[0].display_name
            };
            }

            document.querySelector('#nearme-submit').addEventListener('click', async () => {
            const input = document.querySelector('#nearme-location');
            const manualLocation = input ? input.value.trim() : '';
            const btn = document.querySelector('#nearme-submit');

             // NEW: read the selected radius
            const radiusSelect = document.querySelector('#nearme-radius');
            const radiusKm = radiusSelect ? parseFloat(radiusSelect.value) || 5 : 5;

            // If the user typed a location, geocode and filter trails
            if (manualLocation) {
                btn.textContent = '⏳ Searching…';
                btn.disabled = true;

                try {
                const result = await geocodeAddress(manualLocation);
                if (!result) {
                    alert('Could not find that location. Try a more specific place name.');
                } else {
                    const lat = result.lat;
                    const lon = result.lon;

                    // Optional: show a marker and circle for the searched location
                    if (nearMeMarker) map.removeLayer(nearMeMarker);
                    if (nearMeCircle) map.removeLayer(nearMeCircle);

                    nearMeMarker = L.marker([lat, lon], { title: result.displayName }).addTo(map);
                    nearMeCircle = L.circle([lat, lon], {
                    radius: radiusKm * 1000,
                    color: 'green',
                    fillOpacity: 0.1,
                    interactive: false,
                    pane: 'radiusPane'
                    }).addTo(map);

                    showTrailsNear(lat, lon, radiusKm);
                }
                } catch (e) {
                console.error(e);
                alert('There was a problem looking up that location.');
                } finally {
                btn.textContent = '📍 Use My Location';
                btn.disabled = false;
                }

                return; // do not go on to geolocation
            }

            // 2) If the box is empty, use browser geolocation
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser.');
                return;
            }

            btn.textContent = '⏳ Locating…';
            btn.disabled = true;

            navigator.geolocation.getCurrentPosition(
                pos => {
                btn.textContent = 'Location Found!';
                btn.style.background = 'var(--moss)';

                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;

                if (nearMeMarker) map.removeLayer(nearMeMarker);
                if (nearMeCircle) map.removeLayer(nearMeCircle);

                nearMeMarker = L.marker([lat, lon], { title: 'You are here' }).addTo(map);
                nearMeCircle = L.circle([lat, lon], {
                radius: radiusKm * 1000,
                color: 'green',
                fillOpacity: 0.1,
                interactive: false,
                pane: 'radiusPane'
                }).addTo(map);

                showTrailsNear(lat, lon, radiusKm);
                ;

                setTimeout(() => {
                    btn.textContent = '📍 Use My Location';
                    btn.style.background = '';
                    btn.disabled = false;
                }, 2500);
                },
                err => {
                btn.textContent = '📍 Use My Location';
                btn.disabled = false;
                alert('Could not get your location. Try entering it manually.');
                }
            );
            });

        // Reset report dropdown    
        function resetReportForm() {
            const form = document.querySelector('#report-form');
            if (!form) return;

            const trailInput  = document.querySelector('#report-trail');
            const commentArea = document.querySelector('#report-comment');

            if (trailInput)  trailInput.value  = '';
            if (commentArea) commentArea.value = '';

            // Show form, hide thank‑you
            form.style.display = 'flex';
            const thanks = document.querySelector('#report-thanks');
            if (thanks) {
                thanks.style.display = 'none';
                thanks.innerHTML = '';
            }
            }
        
             // Report a Problem submit
            document.querySelector('#report-submit').addEventListener('click', () => {
                const trail_name  = document.querySelector('#report-trail').value.trim();
                const maint_comment = document.querySelector('#report-comment').value.trim()
                if (!trail_name)    { alert('Please enter a trail name!'); return; }
                if (!isValidTrail(trail_name)) { alert('Please select a valid trail from the list.'); return; }
                if (!maint_comment) { alert('Please describe the problem!'); return; }

                fetch('/api/reports', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ trail_name, maint_comment })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.querySelector('#report-form').style.display = 'none';
                        const thanks = document.querySelector('#report-thanks');
                        thanks.innerHTML = `Report submitted! Thanks! :-)`;
                        thanks.style.display = 'block';
                    }
                })
                .catch(err => {
                    console.error('Error submitting report:', err);
                    alert('Something went wrong. Please try again :-( ');
                });
            });
        </script>

        <script 
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin="">
        </script>
            
        <!-- Plugin to decode encoded polylines -->
        <script src="https://cdn.jsdelivr.net/npm/polyline-encoded@0.0.9/Polyline.encoded.js"></script>


        <!-- BEGIN PILL SCRIPTS -->
        <script>
            // Pill categories

            //Code trail distance
            function getTrailDistance(distance) {
                if (distance < 5000) return '< 5 km';
                if (distance >= 5000 && distance < 10000) return '5–10 km';
                if (distance >= 10000) return '10+ km';
                return 'Unknown';
            }

            //Code trail elevation gain
            function getTrailElevation(elevation) {
                if (elevation < 100) return '< 100 m';
                if (elevation >= 100 && elevation < 500) return '100–500 m';
                if (elevation >= 500 && elevation < 1000) return '500–1000 m';
                if (elevation >= 1000) return '1000+ m';
                return 'Unknown';
            }

            
            function filterTrails(selectedCategory) {
                const categoryMap = {
                    'All':              null,
                    'Not Categorized':        'Not Categorized',
                    '🟢 Category 4':         'Category 4',
                    '🔵 Category 3':         'Category 3',
                    '🔴 Category 2':         'Category 2',
                    '⚫ Category 1':         'Category 1',
                    '🟠 Hors Catégorie':     'Hors Catégorie'
                };

                trailLayers.forEach(obj => {
                    const mapped = categoryMap[selectedCategory];
                    const show = !mapped || obj.trail.climb_category_desc === mapped;
                    if (show) {
                    obj.line.addTo(map);
                    obj.marker.addTo(map);
                    } else {
                    map.removeLayer(obj.line);
                    map.removeLayer(obj.marker);
                    }
                });
            }

            function filterDistance(selectedDistance) {
                const distanceMap = {
                    'All':              null,
                    '< 5 km':      '< 5 km',
                    '5–10 km':         '5–10 km',
                    '10+ km':          '10+ km'
                };

                trailLayers.forEach(obj => {
                    const category = getTrailDistance(obj.trail.distance_m)
                    const mapped = distanceMap[selectedDistance];
                    const show = !mapped || category === mapped;
                    if (show) {
                    obj.line.addTo(map);
                    obj.marker.addTo(map);
                    } else {
                    map.removeLayer(obj.line);
                    map.removeLayer(obj.marker);
                    }
                });
            }

            function filterElevation(selectedElevation) {
                const elevationMap = {
                    'All':              null,
                    '< 100 m':            '< 100 m',
                    '100–500 m':         '100–500 m',
                    '500–1000 m':         '500–1000 m',
                    '1000+ m':          '1000+ m'
                };

                trailLayers.forEach(obj => {
                    const category = getTrailElevation(obj.trail.elevation_gain_m)
                    const mapped = elevationMap[selectedElevation];
                    const show = !mapped || category === mapped;
                    if (show) {
                    obj.line.addTo(map);
                    obj.marker.addTo(map);
                    } else {
                    map.removeLayer(obj.line);
                    map.removeLayer(obj.marker);
                    }
                });
            }

            //filter for trail rating
            function filterByRating(selectedStar) {
                const ratingMap = {
                    'All':   null,
                    '★':     1,
                    '★★':    2,
                    '★★★':   3,
                    '★★★★':  4,
                    '★★★★★': 5
                };

                const minRating = ratingMap[selectedStar];

                trailLayers.forEach(obj => {
                    const trailRating = ratingsMap[obj.trail.name]?.avg_rating ?? 0;
                    const show = !minRating || trailRating >= minRating;
                    if (show) {
                        obj.line.addTo(map);
                        obj.marker.addTo(map);
                    } else {
                        map.removeLayer(obj.line);
                        map.removeLayer(obj.marker);
                    }
                });
            }

            // Pill toggle
            document.querySelectorAll('.filter-pills').forEach(group => {
                group.querySelectorAll('.pill').forEach(pill => {
                    pill.addEventListener('click', () => {
                        group.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
                        pill.classList.add('active');
                       if (group.id === 'distance-pills') {
                            filterDistance(pill.textContent.trim());
                        } else if (group.id === 'elevation-pills') {
                            filterElevation(pill.textContent.trim());
                        } else if (group.id === 'rating-pills') { 
                            filterByRating(pill.textContent.trim());
                        } else {
                            filterTrails(pill.textContent.trim());
                        }
                    });
                });
            });

            // FOR TRAIL NAMES 
            let validTrailNames = []; 

            fetch('/api/trails')
                .then(res => res.json())
                .then(trails => {
                    validTrailNames = trails.map(t => t.name);
                    const datalist = document.getElementById('trail-names-list');
                    trails.forEach(trail => {
                    const option = document.createElement('option');
                    option.value = trail.name;
                    datalist.appendChild(option);
                    });
                })
                .catch(err => console.error('Error loading trail names:', err));

            function isValidTrail(name) {
            return validTrailNames.includes(name);
            }
        
            // FOR TRAIL RATINGS
            let ratingsMap = {};

            fetch('/api/trail_ratings')
                .then(res => res.json())
                .then(ratings => {
                    // Build a lookup dictionary keyed by trail name
                    ratings.forEach(t => {
                        ratingsMap[t.trail_name] = {
                            avg_rating:    t.avg_rating,
                            total_reviews: t.total_reviews
                        };
                    });
                })
                .catch(err => console.error('Error loading ratings:', err));  
        </script>


    <!-- MAP SCRIPT FROM HERE-->
        <script>

                var map = L.map('map', {
                zoomSnap: 0,      // allow any fractional zoom
                zoomDelta: 0.25   // optional: zoom in steps of 0.25
            }).setView([32.75, -16.95], 11.7);

            // Add this pane so the circle is drawn below your polylines
            map.createPane('radiusPane');
            map.getPane('radiusPane').style.zIndex = 350; // trails are in overlayPane (zIndex 400)

            // Keep references to the last Near Me marker/circle
                var nearMeMarker = null;
                var nearMeCircle = null;

                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                }).addTo(map);
                

                // Store all trail layers for filtering/search
                var trailLayers = [];
        
                // Haversine distance in km between two lat/lon points
                function distanceInKm(lat1, lon1, lat2, lon2) {
                var R = 6371;
                var dLat = (lat2 - lat1) * Math.PI / 180;
                var dLon = (lon2 - lon1) * Math.PI / 180;
                var a =
                    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * Math.PI / 180) *
                    Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
                var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
                }

                // Show only trails whose start point is within radiusKm of [lat, lon]
                function showTrailsNear(lat, lon, radiusKm) {
                var nearbyCount = 0;

                trailLayers.forEach(obj => {
                    var t = obj.trail;
                    if (!t.start_lat || !t.start_lon) {
                    if (map.hasLayer(obj.line)) map.removeLayer(obj.line);
                    if (map.hasLayer(obj.marker)) map.removeLayer(obj.marker);
                    return;
                    }

                    var d = distanceInKm(lat, lon, t.start_lat, t.start_lon);

                    if (d <= radiusKm) {
                    if (!map.hasLayer(obj.line)) obj.line.addTo(map);
                    if (!map.hasLayer(obj.marker)) obj.marker.addTo(map);
                    nearbyCount++;
                    } else {
                    if (map.hasLayer(obj.line)) map.removeLayer(obj.line);
                    if (map.hasLayer(obj.marker)) map.removeLayer(obj.marker);
                    }
                });

                if (nearbyCount > 0) {
                    map.setView([lat, lon], 13);
                } else {
                    alert('No trails found within ' + radiusKm + ' km of that location.');
                }
                }

                function showAllTrails() {
                trailLayers.forEach(obj => {
                    if (!map.hasLayer(obj.line)) obj.line.addTo(map);
                    if (!map.hasLayer(obj.marker)) obj.marker.addTo(map);
                });
                }

                // When the Near Me box is cleared, restore all trails
                document.addEventListener('DOMContentLoaded', () => {
                const nearMeInput = document.querySelector('#nearme-location');
                if (nearMeInput) {
                    nearMeInput.addEventListener('input', () => {
                    if (!nearMeInput.value.trim()) {
                        showAllTrails();
                    }
                    });
                }
                });

                document.addEventListener('DOMContentLoaded', () => {
                const clearBtn = document.querySelector('#nearme-clear');
                const input = document.querySelector('#nearme-location');
                if (clearBtn) {
                    clearBtn.addEventListener('click', () => {
                    if (nearMeMarker) {
                        map.removeLayer(nearMeMarker);
                        nearMeMarker = null;
                    }
                    if (nearMeCircle) {
                        map.removeLayer(nearMeCircle);
                        nearMeCircle = null;
                    }
                    if (input) input.value = '';
                    showAllTrails();
                    });
                }
                });

                 // Fetch trails from your API
                fetch('/api/trails')
                    .then(response => response.json())
                    .then(trails => {
                    trails.forEach(trail => {
                        if (trail.start_lat && trail.start_lon && trail.end_lat && trail.end_lon) {
                        var start = [trail.start_lat, trail.start_lon];
                        var end = [trail.end_lat, trail.end_lon];

                        let line;

                    // Search box functions    
                        function filterTrailsByName(query) {
                        var q = (query || "").trim().toLowerCase();

                        trailLayers.forEach(obj => {
                            var name = (obj.trail.name || "").toLowerCase();

                            if (!q || name.includes(q)) {
                            // Show matching (or all, if query empty)
                            if (!map.hasLayer(obj.line)) obj.line.addTo(map);
                            if (!map.hasLayer(obj.marker)) obj.marker.addTo(map);
                        } else {
                            // Hide non-matching
                            if (map.hasLayer(obj.line)) map.removeLayer(obj.line);
                            if (map.hasLayer(obj.marker)) map.removeLayer(obj.marker);
                            }
                        });
                        }

                    // Hook up the search box to the filter
                        var searchInput = document.getElementById('searchInput');
                        var searchClear = document.getElementById('searchClear');

                        if (searchInput) {
                    // Live filter while typing        
                        searchInput.addEventListener('input', function () {
                            filterTrailsByName(this.value);
                        });
                    // Enforce valid trail name on blur
                    searchInput.addEventListener('blur', function () {
                        const val = this.value.trim();
                        if (!val) {
                        // Empty -> show all trails
                        filterTrailsByName('');
                        return;
                        }
                        if (!isValidTrail(val)) {
                        alert('Please select a valid trail from the list.');
                        this.value = '';
                        filterTrailsByName('');
                        }
                    });        

                    //Also enforce validity on Enter key
                    searchInput.addEventListener('keydown', function (e){
                        if (e.key === 'Enter') {
                            const val = this.value.trim();
                            if (!val) {
                                filterTrailsByName('');
                                return;
                            }
                            if (!isValidTrail(val)) {
                                e.preventDefault();
                                alert('Please select a valid trail from the list.');
                                this.value = '';
                                filterTrailsByName('');
                            }
                           }
                         });
                        }   

                        if (searchClear && searchInput) {
                        searchClear.addEventListener('click', () => {
                            searchInput.value = '';
                            filterTrailsByName('');   // show all trails again
                            searchInput.focus();
                        });
                        }    

                        //Color code trails
                        function getClimbColor(category) {
                            if (category == "Not Categorized") return 'gray';
                            if (category == "Category 4")  return '#2F9400'; // green  — easy
                            if (category == "Category 3")  return '#498FC4'; // blue   — moderate
                            if (category == "Category 2")  return '#C44949';//red
                            if (category == "Category 1")  return 'black'; // black  — hard
                            if (category == "Hors Catégorie")  return '#C48449'; // orange — very steep
                            return 'gray';
                            }


                        // If we have a polyline, use the full shape
                        if (trail.polyline) {
                        try {
                            line = L.Polyline.fromEncoded(trail.polyline, { color: getClimbColor(trail.climb_category_desc) }).addTo(map);
                        } catch (e) {
                            console.error('Error decoding polyline for trail', trail.strava_segment_id, e);
                            // Fallback to straight line if decoding fails
                            line = L.polyline([start, end], { color: getClimbColor(trail.climb_category_desc) }).addTo(map);
                        }
                        } else {
                        // Fallback: straight line between start and end
                        line = L.polyline([start, end], { color: getClimbColor(trail.climb_category_desc) }).addTo(map);
                        }

                        // Add a marker at start
                        var marker = L.circleMarker(start, { radius: 4, color: 'green' }).addTo(map);


                    //POPUP INFORMATION
                        
                    function buildBasePopup(trail) {
                        const ratingInfo = ratingsMap[trail.name];
                        const avgRating   = ratingInfo ? ratingInfo.avg_rating : null;
                        const totalReviews = ratingInfo ? ratingInfo.total_reviews : 0;

                        const ratingText = avgRating !== null
                            ? `${avgRating}★ (${totalReviews} reviews)`
                            : 'No reviews yet';

                        return `
                            <strong>${trail.name}</strong><br />
                            Distance: ${trail.distance_m} m<br />
                            Elevation gain: ${trail.elevation_gain_m} m<br />
                            Climb grade: ${trail.climb_category_desc} <br />
                            Average Rating: ${ratingText}
                        `;
                    }

                    // POPUP INFORMATION (dynamic: includes latest trail report if recent)
                        function updatePopupWithLatestReport(popup, trail) {
                            // Start with base content (stats + rating)
                            let content = buildBasePopup(trail);

                            fetch(`/api/latest_report?trail_name=${encodeURIComponent(trail.name)}`)
                                .then(res => res.json())
                                .then(data => {
                                    if (data.has_recent) {
                                        // Optionally format date more nicely if you want
                                        content += `<br /><br /><strong>Latest trail report (last 2 weeks):</strong><br />${data.maint_comment}`;
                                    }
                                    popup.setContent(content);
                                })
                                .catch(err => {
                                    console.error('Error loading latest report:', err);
                                    popup.setContent(content); // fall back to base content
                                });
                        }

                        // Bind popup and hook into the popupopen event
                        const popup = L.popup().setContent('Loading…');
                        line.bindPopup(popup);
                        marker.bindPopup(popup);

                        line.on('popupopen', function (e) {
                            updatePopupWithLatestReport(e.popup, trail);
                        });
                        marker.on('popupopen', function (e) {
                            updatePopupWithLatestReport(e.popup, trail);
                        });


                         // Save for search/filtering
                        trailLayers.push({
                        trail: trail,
                        line: line,
                        marker: marker
                        });
                        }
                    });
                    })
                    .catch(err => {
                    console.error('Error loading trails:', err);
                });
        </script>
